<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — UP Finance Handbook Archive</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    max-width: 48rem;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
    line-height: 1.7;
    background: light-dark(#faf7f0, #171717);
    color: light-dark(#1c1917, #e7e5e4);
  }
  .banner {
    font-family: system-ui, sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #b45309;
    border-bottom: 3px solid #b45309;
    padding-bottom: 0.75rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .banner a { font-family: system-ui, sans-serif; text-transform: none; letter-spacing: normal; font-weight: 600; }
  h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
  a { color: #b45309; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
  td, th { border: 1px solid light-dark(#d6d3d1, #404040); padding: 0.4rem 0.6rem; vertical-align: top; }
  #status { font-family: system-ui, sans-serif; font-size: 0.95rem; opacity: 0.7; }
  #browse { font-family: system-ui, sans-serif; font-size: 0.9rem; margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid light-dark(#d6d3d1, #404040); }
  #browse h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.6; margin-bottom: 0.75rem; }
  #browse .volume { margin-bottom: 1rem; }
  #browse .volume-label { font-weight: 600; opacity: 0.8; margin-bottom: 0.3rem; }
  #browse ul { list-style: none; margin: 0; padding: 0; }
  #browse li { padding: 0.15rem 0; }
</style>
</head>
<body>
  <p class="banner">
    <span>Offline — showing a cached copy</span>
    <a href="/">&larr; Home</a>
  </p>
  <div id="status">Looking for this page in your offline cache…</div>
  <div id="content"></div>
  <div id="browse"></div>
  <script>
    (function () {
      var slug = location.pathname.replace(/^\/+/, '');
      var statusEl = document.getElementById('status');
      var contentEl = document.getElementById('content');
      var browseEl = document.getElementById('browse');

      function show(page) {
        statusEl.style.display = 'none';
        document.title = page.title + ' — UP Finance Handbook Archive (offline)';
        var h1 = document.createElement('h1');
        h1.textContent = page.title;
        var src = document.createElement('p');
        src.innerHTML = '<a href="' + page.sourceUrl + '" target="_blank" rel="noopener noreferrer">View original on budget.up.nic.in</a> (link needs a connection)';
        var body = document.createElement('div');
        body.innerHTML = page.html;
        contentEl.append(h1, src, body);
      }

      function notFound() {
        statusEl.textContent = "This page hasn't been cached on this device yet — reconnect once to make it available offline.";
      }

      // No sidebar/nav tree here (that's nav.json, only bundled into the Next.js
      // app), but every cached page's own `volume` field is enough to build a
      // flat "what's available right now" list from the same IndexedDB store.
      function renderBrowseList(pages) {
        if (!pages.length) return;
        var byVolume = {};
        pages.forEach(function (p) {
          (byVolume[p.volume] = byVolume[p.volume] || []).push(p);
        });
        var h2 = document.createElement('h2');
        h2.textContent = 'Available offline (' + pages.length + ' pages)';
        browseEl.appendChild(h2);
        Object.keys(byVolume).sort().forEach(function (vol) {
          var group = document.createElement('div');
          group.className = 'volume';
          var label = document.createElement('div');
          label.className = 'volume-label';
          label.textContent = vol;
          var ul = document.createElement('ul');
          byVolume[vol]
            .sort(function (a, b) { return a.title.localeCompare(b.title); })
            .forEach(function (p) {
              var li = document.createElement('li');
              var a = document.createElement('a');
              a.href = '/' + p.slug;
              a.textContent = p.title;
              li.appendChild(a);
              ul.appendChild(li);
            });
          group.append(label, ul);
          browseEl.appendChild(group);
        });
      }

      if (!('indexedDB' in window)) { notFound(); return; }
      var req = indexedDB.open('up-finance-handbook');
      req.onerror = notFound;
      req.onsuccess = function () {
        try {
          var tx = req.result.transaction('pages', 'readonly');
          var store = tx.objectStore('pages');

          if (slug) {
            var getReq = store.get(slug);
            getReq.onsuccess = function () {
              if (getReq.result) show(getReq.result); else notFound();
            };
            getReq.onerror = notFound;
          } else {
            statusEl.style.display = 'none';
          }

          var allReq = store.getAll();
          allReq.onsuccess = function () { renderBrowseList(allReq.result || []); };
        } catch (e) { notFound(); }
      };
    })();
  </script>
</body>
</html>
